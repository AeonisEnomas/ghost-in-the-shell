# Streamlit settings for Ghost in the Shell. Read when the app is started with
# the `ghost-in-the-shell` command, which runs Streamlit from this folder.

[server]
# Only this computer can open the app.
address = "127.0.0.1"
headless = true
enableStaticServing = true
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showSidebarNavigation = true

[runner]
magicEnabled = false

[theme]
base = "dark"
# Amber on black, like an amber monitor. Amber is the only interface colour;
# green, blue, yellow and red are the four risk levels, and violet marks text
# the model wrote. Everything is set in one monospaced typeface.
backgroundColor = "#0B0906"
secondaryBackgroundColor = "#100C07"
textColor = "#E3A93C"
primaryColor = "#FFB000"
borderColor = "#57400F"
linkColor = "#FFB000"
codeBackgroundColor = "#100C07"
codeTextColor = "#FFD68A"
showWidgetBorder = true
baseRadius = "0px"
buttonRadius = "0px"
baseFontSize = 14
font = "IBM Plex Mono, ui-monospace, monospace"
headingFont = "IBM Plex Mono, ui-monospace, monospace"
codeFont = "IBM Plex Mono, ui-monospace, monospace"
codeFontSize = "0.9rem"
headingFontWeights = [500, 500, 500, 500, 500, 500]
headingFontSizes = ["1.5rem", "1.15rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
greenColor = "#7FD98A"
blueColor = "#6CB6FF"
yellowColor = "#FFE14D"
orangeColor = "#FFE14D"
redColor = "#FF5C5C"
violetColor = "#C9A0FF"
grayColor = "#A87B26"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "/app/static/fonts/ibm-plex-mono-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "/app/static/fonts/ibm-plex-mono-500.woff2"
weight = 500

[theme.sidebar]
backgroundColor = "#0B0906"
secondaryBackgroundColor = "#100C07"
borderColor = "#57400F"
